[workspace]
resolver = "2"
members = [
    "crates/dewdrop-core",
    "crates/dewdrop-engine",
    "crates/dewdrop-shell",
    "bins/dewdrop",
    "bins/dewdrop-worker",
    "tools/drag-harness",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.210", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.128", default-features = false, features = ["std"] }
image = { version = "=0.25.2", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico"] }
fast_image_resize = { version = "=4.2.1", default-features = false, features = ["image"] }
jpeg-encoder = { version = "=0.6.0", default-features = false, features = ["simd"] }
webp = { version = "=0.3.0", default-features = false }
ab_glyph = { version = "=0.2.28", default-features = false, features = ["std"] }
lopdf = { version = "=0.34.0", default-features = false, features = ["pom_parser"] }
pdf-writer = { version = "=0.12.1", default-features = false }
docx-rs = { version = "=0.4.17", default-features = false }
rustybuzz = { version = "=0.18.0", default-features = false }
ttf-parser = { version = "=0.24.1", default-features = false, features = ["std"] }
zip = { version = "=2.2.0", default-features = false, features = ["deflate"] }
tar = { version = "=0.4.42", default-features = false }
flate2 = { version = "=1.0.34", default-features = false, features = ["rust_backend"] }
bzip2 = { version = "=0.4.4", default-features = false }
lzma-rs = { version = "=0.3.0", default-features = false }
md-5 = { version = "=0.10.6", default-features = false, features = ["std"] }
sha1 = { version = "=0.10.6", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.8", default-features = false, features = ["std"] }
csv = { version = "=1.3.0", default-features = false }
encoding_rs = { version = "=0.8.34", default-features = false }
windows = { version = "=0.58.0", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"

[profile.release.package.dewdrop-worker]
opt-level = 3

[profile.release.package.dewdrop-engine]
opt-level = 3
